<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No-Pilot</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="coi-serviceworker.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
</head>

<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <h2>Loading No-Pilot</h2>
            <p id="loadingStatus">Initializing models...</p>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="app-container" style="display: none;">
        <!-- Navigation Pane -->
        <nav id="navPane" class="nav-pane">
            <div class="nav-header">
                <button id="toggleNav" class="nav-toggle">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <rect y="4" width="20" height="2"></rect>
                        <rect y="9" width="20" height="2"></rect>
                        <rect y="14" width="20" height="2"></rect>
                    </svg>
                </button>
            </div>

            <button class="nav-item new-chat-btn" data-page="newChat">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M3 4h14v2H5v10h10v-6h2v8H3V4z"></path>
                    <path d="M14 3h3v3l-3-3zm0 0l3 3-7 7-3-3 7-7z"></path>
                </svg>
                <span class="nav-text">New chat</span>
            </button>

            <button class="nav-item" data-page="search">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <path
                        d="M8.5 3a5.5 5.5 0 0 1 4.38 8.82l4.15 4.15a.75.75 0 0 1-1.06 1.06l-4.15-4.15A5.5 5.5 0 1 1 8.5 3zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8z">
                    </path>
                </svg>
                <span class="nav-text">Search</span>
            </button>

            <div class="nav-separator">
                <span class="nav-text">Agents</span>
            </div>

            <button class="nav-item" data-page="researcher">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <circle cx="10" cy="10" r="7" fill="#4A9EFF" />
                </svg>
                <span class="nav-text">Researcher</span>
            </button>

            <button class="nav-item" data-page="analyst">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M3 3h4v10H3V3zm5 6h4v4H8V9zm5-3h4v7h-4V6z" fill="#C87EFF" />
                </svg>
                <span class="nav-text">Analyst</span>
            </button>
        </nav>

        <!-- Main Content Pane -->
        <main id="mainContent" class="main-content">
            <!-- Header -->
            <header class="content-header">
                <div class="header-title">
                    <span id="pageTitle">New chat</span>
                </div>
                <div class="header-actions">
                    <button id="restartBtn" class="icon-btn" title="Restart chat">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M6 6c0-1.1.9-2 2-2h8c1.1 0 2 .9 2 2v7c0 1.1-.9 2-2 2h-1.5l-2 2-2-2H8c-1.1 0-2-.9-2-2V6zm2-1c-.55 0-1 .45-1 1v7c0 .55.45 1 1 1h3l1.5 1.5L13 14h3c.55 0 1-.45 1-1V6c0-.55-.45-1-1-1H8z">
                            </path>
                        </svg>
                    </button>
                    <button id="menuBtn" class="icon-btn">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <circle cx="10" cy="5" r="1.5"></circle>
                            <circle cx="10" cy="10" r="1.5"></circle>
                            <circle cx="10" cy="15" r="1.5"></circle>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div id="pageContent" class="page-content">
                <!-- Dynamic content loaded here -->
            </div>

            <!-- Input Area (for chat pages) -->
            <div id="inputArea" class="input-area" style="display: none;">
                <div id="attachmentsContainer" class="attachments-container" style="display: none;"></div>
                <div class="input-container">
                    <button class="attach-btn" id="attachBtn">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M10 3a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H4a1 1 0 1 1 0-2h5V4a1 1 0 0 1 1-1z">
                            </path>
                        </svg>
                    </button>
                    <input type="text" id="userInput" placeholder="Message No-Pilot" />
                    <button id="voiceBtn" class="voice-btn">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M10 2a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zm-5 8a1 1 0 1 1 2 0 3 3 0 0 0 6 0 1 1 0 1 1 2 0 5 5 0 0 1-4 4.9V17h2a1 1 0 1 1 0 2H7a1 1 0 1 1 0-2h2v-2.1A5 5 0 0 1 5 10z">
                            </path>
                        </svg>
                    </button>
                    <button id="stopBtn" class="stop-btn" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <rect x="6" y="6" width="8" height="8"></rect>
                        </svg>
                    </button>
                    <button id="submitBtn" class="submit-btn">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 3l7 7-1.5 1.5L11 7v10H9V7L4.5 11.5 3 10l7-7z"></path>
                        </svg>
                    </button>
                </div>
                <div class="suggestion-buttons">
                    <button class="suggestion-btn" data-menu="suggested">Suggested</button>
                    <button class="suggestion-btn" data-menu="files">Files</button>
                    <button class="suggestion-btn" data-menu="emails">Emails</button>
                    <button class="suggestion-btn" data-menu="people">People</button>
                </div>
            </div>

            <!-- Shared menus (outside inputArea so they're always accessible) -->
            <div id="suggestionDropdown" class="suggestion-dropdown" style="display: none;"></div>
            <div id="attachmentMenu" class="attachment-menu" style="display: none;"></div>

            <!-- Footer -->
            <footer class="app-footer">
                <p>AI-generated content may be inaccurate.</p>
            </footer>
        </main>
    </div>

    <!-- Modal for displaying items -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu" style="display: none;">
        <div class="menu-header">Model Selection</div>
        <button class="menu-item" data-model="phi3">Phi 3 Mini</button>
        <button class="menu-item" data-model="phi2">Phi 2</button>
        <button class="menu-item" data-model="wikipedia">Wikipedia (Fallback)</button>
    </div>

    <script type="module" src="app.js?v=20260505-96"></script>
</body>

</html>
